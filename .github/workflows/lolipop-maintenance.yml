name: Lolipop conservative maintenance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply inactive official updates and dashboard editor hardening
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lolipop-maintenance
  cancel-in-progress: false

jobs:
  connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Conservative maintenance with rollback
        shell: bash
        env:
          LOLIPOP_SSH_PASSWORD: ${{ secrets.LOLIPOP_SSH_PASSWORD }}
          LOLIPOP_KNOWN_HOSTS: ${{ secrets.LOLIPOP_KNOWN_HOSTS }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [[ -z "$LOLIPOP_SSH_PASSWORD" || -z "$LOLIPOP_KNOWN_HOSTS" ]]; then
            echo 'Configure LOLIPOP_SSH_PASSWORD and LOLIPOP_KNOWN_HOSTS in repository Actions secrets.'
            exit 1
          fi
          umask 077
          session_dir=$(mktemp -d "$RUNNER_TEMP/lolipop-connect.XXXXXXXX")
          trap 'rm -rf -- "$session_dir"' EXIT
          printf '%s\n' "$LOLIPOP_KNOWN_HOSTS" > "$session_dir/known_hosts"
          ssh-keygen -F '[ssh.lolipop.jp]:2222' -f "$session_dir/known_hosts" > /dev/null
          cat > "$session_dir/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$LOLIPOP_SSH_PASSWORD"
          ASKPASS
          chmod 700 "$session_dir/askpass"
          export SSH_ASKPASS="$session_dir/askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          ssh -T -p 2222 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$session_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=keyboard-interactive,password \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            perma.jp-goat-music@ssh.lolipop.jp "GOAT_APPLY=$APPLY /usr/local/php/8.5/bin/php" \
            < scripts/conservative-update.php | tee -a "$GITHUB_STEP_SUMMARY"
